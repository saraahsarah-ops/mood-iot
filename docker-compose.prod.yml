# ============================================================================
# Mood-IoT — Docker Compose PRODUCTION (Oracle Cloud / Hetzner VPS / OVH HDS)
#
# Usage :
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Reverse proxy : Caddy (auto-TLS Let's Encrypt sur api.mood-iot.fr + auth.mood-iot.fr)
# Pas de volumes mountés sur ./src/ → les images sont auto-suffisantes
# Pas de --reload uvicorn → CMD prod du Dockerfile
# ============================================================================

x-restart-policy: &restart unless-stopped

x-backend-base: &backend-base
  restart: *restart
  env_file: .env.prod
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ── Caddy reverse proxy ── auto-TLS Let's Encrypt ───────────────────────
  caddy:
    image: caddy:2-alpine
    restart: *restart
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway-service
      - keycloak

  # ── Postgres ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    restart: *restart
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Migrations exécutées au 1er init (BD vide). Ordre = ordre alphabétique.
      # Source réelle : backend/infrastructure/database/ (pas backend/migrations).
      - ./backend/infrastructure/database/00-keycloak-schema.sql:/docker-entrypoint-initdb.d/00-keycloak-schema.sql:ro
      - ./backend/infrastructure/database/01-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
      - ./backend/infrastructure/database/02-schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
      - ./backend/infrastructure/database/03-indexes.sql:/docker-entrypoint-initdb.d/03-indexes.sql:ro
      - ./backend/infrastructure/database/06-keycloak-migration.sql:/docker-entrypoint-initdb.d/06-keycloak-migration.sql:ro
      - ./backend/infrastructure/database/07-notification-rdv.sql:/docker-entrypoint-initdb.d/07-notification-rdv.sql:ro
      - ./backend/infrastructure/database/08-humeur-entries.sql:/docker-entrypoint-initdb.d/08-humeur-entries.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # NB : exposition en interne uniquement, pas de port mappé sur l'hôte

  # ── Redis ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: *restart
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Keycloak ────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: *restart
    # --import-realm : importe le realm 'moodiot' au boot s'il n'existe pas encore
    command: start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "false"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
    volumes:
      - ./infrastructure/keycloak/realm-moodiot.json:/opt/keycloak/data/import/realm-moodiot.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 'Connection: close' indispensable : sans ça le serveur garde la connexion
      # keep-alive ouverte et `cat` bloque jusqu'au timeout → faux 'unhealthy'.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Microservices FastAPI ───────────────────────────────────────────────
  gateway-service:
    <<: *backend-base
    image: ${REGISTRY:-mood-iot}/gateway:${TAG:-latest}
    # Chaque service expose son health sur un path préfixé (cf. gateway main.py).
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    build:
      context: ./backend
      dockerfile: infrastructure/docker/Dockerfile
      args:
        SERVICE_NAME: gateway

  # NB : le gateway résout les services par (nom, port) — cf. backend/src/gateway/main.py
  #   auth-service:8001, patient-service:8002, ml-scoring:8003,
  #   notification-service:8004, teleconsult-service:8005, doctor-service:8006
  # → chaque service DOIT exposer le bon SERVICE_PORT et porter le bon nom réseau.
  auth-service:
    <<: *backend-base
    image: ${REGISTRY:-mood-iot}/auth:${TAG:-latest}
    environment:
      SERVICE_PORT: 8001
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8001/auth/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    build:
      context: ./backend
      dockerfile: infrastructure/docker/Dockerfile
      args:
        SERVICE_NAME: auth

  patient-service:
    <<: *backend-base
    image: ${REGISTRY:-mood-iot}/patient:${TAG:-latest}
    environment:
      SERVICE_PORT: 8002
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8002/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    build:
      context: ./backend
      dockerfile: infrastructure/docker/Dockerfile
      args:
        SERVICE_NAME: patient

  # Le gateway cherche ce service sous le nom réseau "ml-scoring" (pas scoring-service)
  ml-scoring:
    <<: *backend-base
    image: ${REGISTRY:-mood-iot}/scoring:${TAG:-latest}
    environment:
      SERVICE_PORT: 8003
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8003/scoring/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    build:
      context: ./backend
      dockerfile: infrastructure/docker/Dockerfile
      args:
        SERVICE_NAME: scoring

  notification-service:
    <<: *backend-base
    image: ${REGISTRY:-mood-iot}/notification:${TAG:-latest}
    environment:
      SERVICE_PORT: 8004
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8004/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    build:
      context: ./backend
      dockerfile: infrastructure/docker/Dockerfile
      args:
        SERVICE_NAME: notification

  teleconsult-service:
    <<: *backend-base
    image: ${REGISTRY:-mood-iot}/teleconsult:${TAG:-latest}
    environment:
      SERVICE_PORT: 8005
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8005/teleconsult/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    build:
      context: ./backend
      dockerfile: infrastructure/docker/Dockerfile
      args:
        SERVICE_NAME: teleconsult

  doctor-service:
    <<: *backend-base
    image: ${REGISTRY:-mood-iot}/doctor:${TAG:-latest}
    environment:
      SERVICE_PORT: 8006
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8006/doctor/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    build:
      context: ./backend
      dockerfile: infrastructure/docker/Dockerfile
      args:
        SERVICE_NAME: doctor

  # ── Dashboard médecin (Next.js standalone) ──────────────────────────────
  dashboard:
    image: ${REGISTRY:-mood-iot}/dashboard:${TAG:-latest}
    restart: *restart
    build:
      context: ./frontend/dashboard
      dockerfile: Dockerfile
      args:
        # URL publique de l'API (injectée au build, côté navigateur)
        NEXT_PUBLIC_API_URL: https://api.mood-iot.fr/api/v1
    environment:
      # NextAuth v5 + Keycloak (runtime)
      AUTH_KEYCLOAK_ID: dashboard-medecin
      AUTH_KEYCLOAK_ISSUER: https://auth.mood-iot.fr/realms/moodiot
      AUTH_KEYCLOAK_SECRET: ${AUTH_KEYCLOAK_SECRET}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: https://dashboard.mood-iot.fr
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_API_URL: https://api.mood-iot.fr/api/v1
    depends_on:
      - keycloak
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
