# ============================================================================
# Mood-IoT : Docker Compose — Environnement de développement local
# Conforme au diagramme docker_aws_deployment_mood_iot.drawio
# ============================================================================

services:

  # ── Base de données ──────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: mood-iot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mood_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mood_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-mood_iot}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/infrastructure/database/00-keycloak-schema.sql:/docker-entrypoint-initdb.d/00-keycloak-schema.sql
      - ./backend/infrastructure/database/01-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql
      - ./backend/infrastructure/database/02-schema.sql:/docker-entrypoint-initdb.d/02-schema.sql
      - ./backend/infrastructure/database/03-indexes.sql:/docker-entrypoint-initdb.d/03-indexes.sql
      - ./backend/infrastructure/database/04-seed.sql:/docker-entrypoint-initdb.d/04-seed.sql
      - ./backend/infrastructure/database/05-doctor-institution-migration.sql:/docker-entrypoint-initdb.d/05-doctor-institution-migration.sql
      - ./backend/infrastructure/database/06-keycloak-migration.sql:/docker-entrypoint-initdb.d/06-keycloak-migration.sql
    networks:
      - mood-iot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mood_user} -d ${POSTGRES_DB:-mood_iot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Cache & Pub/Sub ──────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mood-iot-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - mood-iot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Keycloak (auth identity provider — port 8080) ──────────────────────
  # Démarre en mode dev (HTTP, pas de TLS) avec import automatique du realm
  # `moodiot` depuis infrastructure/keycloak/realm-moodiot.json
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: mood-iot-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-change-me-keycloak-admin}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_DB: "postgres"
      KC_DB_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mood_iot}"
      KC_DB_USERNAME: ${POSTGRES_USER:-mood_user}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-mood_secret_2026}
      KC_DB_SCHEMA: keycloak
    ports:
      - "8080:8080"
    volumes:
      - ./infrastructure/keycloak/realm-moodiot.json:/opt/keycloak/data/import/realm-moodiot.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mood-iot-network
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ── API Gateway (port 8000) ──────────────────────────────────────────────
  api-gateway:
    build:
      context: ./backend
      dockerfile: infrastructure/docker/Dockerfile
      args:
        SERVICE_NAME: gateway
    container_name: mood-iot-gateway
    restart: unless-stopped
    ports:
      - "8010:8000"
    environment:
      - SERVICE_NAME=gateway
      - SERVICE_PORT=8000
      - DATABASE_URL=${DATABASE_URL:-postgresql://mood_user:mood_secret_2026@postgres:5432/mood_iot}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-LTDNcEcwfj3wHgE7UFOVjF3kK1p7qV669cOyoF8rf-Y=}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ENVIRONMENT=docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mood-iot-network

  # ── Auth Service (port 8001) ─────────────────────────────────────────────
  auth-service:
    build:
      context: ./backend
      dockerfile: infrastructure/docker/Dockerfile
      args:
        SERVICE_NAME: auth
    container_name: mood-iot-auth
    restart: unless-stopped
    ports:
      - "8011:8001"
    environment:
      - SERVICE_NAME=auth
      - SERVICE_PORT=8001
      - DATABASE_URL=${DATABASE_URL:-postgresql://mood_user:mood_secret_2026@postgres:5432/mood_iot}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-LTDNcEcwfj3wHgE7UFOVjF3kK1p7qV669cOyoF8rf-Y=}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mood-iot-network

  # ── Patient Service (port 8002) ──────────────────────────────────────────
  patient-service:
    build:
      context: ./backend
      dockerfile: infrastructure/docker/Dockerfile
      args:
        SERVICE_NAME: patient
    container_name: mood-iot-patient
    restart: unless-stopped
    ports:
      - "8012:8002"
    environment:
      - SERVICE_NAME=patient
      - SERVICE_PORT=8002
      - DATABASE_URL=${DATABASE_URL:-postgresql://mood_user:mood_secret_2026@postgres:5432/mood_iot}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-LTDNcEcwfj3wHgE7UFOVjF3kK1p7qV669cOyoF8rf-Y=}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mood-iot-network

  # ── ML Scoring Service (port 8003) ───────────────────────────────────────
  ml-scoring:
    build:
      context: ./backend
      dockerfile: infrastructure/docker/Dockerfile
      args:
        SERVICE_NAME: scoring
    container_name: mood-iot-scoring
    restart: unless-stopped
    ports:
      - "8013:8003"
    environment:
      - SERVICE_NAME=scoring
      - SERVICE_PORT=8003
      - DATABASE_URL=${DATABASE_URL:-postgresql://mood_user:mood_secret_2026@postgres:5432/mood_iot}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-LTDNcEcwfj3wHgE7UFOVjF3kK1p7qV669cOyoF8rf-Y=}
      - SCORING_THRESHOLDS=${SCORING_THRESHOLDS:-40/60/80}
      - MODEL_S3_BUCKET=${MODEL_S3_BUCKET:-mood-iot-models}
      - SCORING_DISABLE_XGBOOST=${SCORING_DISABLE_XGBOOST:-false}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-http://localstack:4566}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mood-iot-network

  # ── Notification Service (port 8004) ─────────────────────────────────────
  notification-service:
    build:
      context: ./backend
      dockerfile: infrastructure/docker/Dockerfile
      args:
        SERVICE_NAME: notification
    container_name: mood-iot-notification
    restart: unless-stopped
    ports:
      - "8014:8004"
    environment:
      - SERVICE_NAME=notification
      - SERVICE_PORT=8004
      - DATABASE_URL=${DATABASE_URL:-postgresql://mood_user:mood_secret_2026@postgres:5432/mood_iot}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-LTDNcEcwfj3wHgE7UFOVjF3kK1p7qV669cOyoF8rf-Y=}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - FCM_CREDENTIALS_JSON=${FCM_CREDENTIALS_JSON:-{}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mood-iot-network

  # ── Teleconsult Service (port 8005) ──────────────────────────────────────
  teleconsult-service:
    build:
      context: ./backend
      dockerfile: infrastructure/docker/Dockerfile
      args:
        SERVICE_NAME: teleconsult
    container_name: mood-iot-teleconsult
    restart: unless-stopped
    ports:
      - "8015:8005"
    environment:
      - SERVICE_NAME=teleconsult
      - SERVICE_PORT=8005
      - DATABASE_URL=${DATABASE_URL:-postgresql://mood_user:mood_secret_2026@postgres:5432/mood_iot}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-LTDNcEcwfj3wHgE7UFOVjF3kK1p7qV669cOyoF8rf-Y=}
      - JITSI_SERVER_URL=${JITSI_SERVER_URL:-https://meet.jit.si}
      - JITSI_JWT_SECRET=${JITSI_JWT_SECRET:-change-me}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mood-iot-network

  # ── Doctor Service (port 8006) ───────────────────────────────────────────
  doctor-service:
    build:
      context: ./backend
      dockerfile: infrastructure/docker/Dockerfile
      args:
        SERVICE_NAME: doctor
    container_name: mood-iot-doctor
    restart: unless-stopped
    ports:
      - "8016:8006"
    environment:
      - SERVICE_NAME=doctor
      - SERVICE_PORT=8006
      - DATABASE_URL=${DATABASE_URL:-postgresql://mood_user:mood_secret_2026@postgres:5432/mood_iot}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-LTDNcEcwfj3wHgE7UFOVjF3kK1p7qV669cOyoF8rf-Y=}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mood-iot-network

  # ── Dashboard psychiatre (port 3000) ─────────────────────────────────────
  dashboard:
    build:
      context: ./frontend/dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8010/api/v1}
    container_name: mood-iot-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks:
      - mood-iot-network

  # ── LocalStack (émule AWS en dev) ────────────────────────────────────────
  localstack:
    image: localstack/localstack:3
    container_name: mood-iot-localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sqs,sns,secretsmanager
      - DEFAULT_REGION=eu-west-3
    networks:
      - mood-iot-network

volumes:
  pgdata:

networks:
  mood-iot-network:
    driver: bridge
