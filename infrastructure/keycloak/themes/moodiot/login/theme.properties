# Thème de connexion Mood-IoT.
# Hérite du thème "keycloak" (toutes les pages : login, register, verify-email,
# reset-password, OTP/MFA, erreurs) et le rebrande via CSS uniquement —
# aucune fonctionnalité Keycloak n'est perdue.
parent=keycloak
import=common/keycloak

# login.css vient du parent ; custom.css (le nôtre) est chargé après → override.
styles=css/login.css css/custom.css
