<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mood-IoT Mobile Preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Phone frame */
    .phone {
      width: 375px;
      height: 812px;
      background: #f0f2f5;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 0 0 8px #222, 0 0 0 10px #444, 0 20px 60px rgba(0,0,0,0.5);
      position: relative;
    }

    /* Status bar */
    .status-bar {
      height: 44px;
      background: #f0f2f5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      font-size: 14px;
      font-weight: 600;
      color: #1a1a1a;
    }
    .status-bar .notch {
      width: 120px;
      height: 28px;
      background: #222;
      border-radius: 0 0 18px 18px;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
    }
    .status-icons { display: flex; gap: 5px; font-size: 12px; }

    /* Screen content */
    .screen {
      height: calc(100% - 44px);
      overflow-y: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    /* Card */
    .card {
      background: white;
      border-radius: 30px;
      padding: 24px 20px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
    }

    /* ==================== LOGIN SCREEN ==================== */
    .login-icon { font-size: 48px; margin-bottom: 8px; }
    .login-title { font-size: 22px; font-weight: 900; color: #1a1a1a; margin-bottom: 4px; }
    .login-subtitle { font-size: 14px; color: #636e72; margin-bottom: 28px; }

    .input-field {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 15px;
      color: #333;
      margin-bottom: 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-field:focus { border-color: #007AFF; }
    .input-field::placeholder { color: #999; }

    /* ==================== MAIN SCREEN ==================== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      width: 100%;
      margin-bottom: 16px;
      text-align: left;
    }
    .header-title { font-size: 22px; font-weight: 900; color: #1a1a1a; }
    .header-welcome { font-size: 14px; color: #636e72; margin-top: 2px; }
    .header-logout { font-size: 13px; color: #e74c3c; font-weight: 600; cursor: pointer; border: none; background: none; padding-top: 4px; }

    .location-badge {
      background: #f8f9fa;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 24px;
      display: inline-block;
    }
    .location-text { font-size: 11px; color: #636e72; font-family: monospace; }

    .stats-grid {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 24px;
    }
    .stat-box { flex: 1; text-align: center; }
    .stat-label {
      font-size: 10px;
      color: #8e8e93;
      font-weight: bold;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .stat-value { font-size: 32px; font-weight: 900; color: #2ecc71; }
    .stat-value.bpm { color: #e74c3c; }
    .stat-value.sleep { color: #9b59b6; font-size: 24px; }

    /* Sync status */
    .sync-badge {
      padding: 8px 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      width: 100%;
      font-size: 13px;
      font-weight: 600;
      color: #333;
    }
    .sync-success { background: #d4edda; }
    .sync-sending { background: #fff3cd; }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 15px;
      border-radius: 15px;
      border: none;
      font-size: 13px;
      font-weight: 800;
      color: white;
      cursor: pointer;
      margin-bottom: 10px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn:active { opacity: 0.7; }
    .btn-primary { background: #007AFF; }
    .btn-secondary { background: #636e72; }
    .btn-disabled { opacity: 0.6; cursor: not-allowed; }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Navigation dots */
    .nav-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ddd;
      cursor: pointer;
      transition: background 0.3s;
    }
    .dot.active { background: #007AFF; }

    /* Home bar */
    .home-bar {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 134px;
      height: 5px;
      background: #333;
      border-radius: 3px;
    }

    /* Hidden class */
    .hidden { display: none !important; }

    /* Screenshot label */
    .screenshot-label {
      position: fixed;
      top: 12px;
      left: 12px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-family: monospace;
      z-index: 100;
    }
  </style>
</head>
<body>

<div class="screenshot-label" id="screenshotLabel">Ecran 1/4 : Login</div>

<div class="phone">
  <div class="status-bar">
    <span>9:41</span>
    <div class="notch"></div>
    <div class="status-icons">
      <span>&#9679;&#9679;&#9679;&#9679;</span>
      <span>WiFi</span>
      <span>100%</span>
    </div>
  </div>

  <div class="screen">
    <!-- ============ LOGIN SCREEN ============ -->
    <div class="card" id="loginScreen">
      <div class="login-icon">🏥</div>
      <div class="login-title">Mood-IoT</div>
      <div class="login-subtitle">Application Patient</div>

      <input class="input-field" type="email" id="emailInput" placeholder="Adresse email" value="sophie.dupont@email.fr">
      <input class="input-field" type="password" id="passInput" placeholder="Mot de passe" value="••••••••••">

      <button class="btn btn-primary" id="loginBtn" onclick="handleLogin()">SE CONNECTER</button>
    </div>

    <!-- ============ MAIN SCREEN ============ -->
    <div class="card hidden" id="mainScreen">
      <div class="header">
        <div>
          <div class="header-title">Mood-IoT</div>
          <div class="header-welcome">Bonjour, Sophie</div>
        </div>
        <button class="header-logout" onclick="handleLogout()">Deconnexion</button>
      </div>

      <div class="location-badge">
        <span class="location-text" id="locationText">📍 Localisation...</span>
      </div>

      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-label">PAS</div>
          <div class="stat-value" id="stepsVal">--</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">BPM</div>
          <div class="stat-value bpm" id="bpmVal">--</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">SOMMEIL</div>
          <div class="stat-value sleep" id="sleepVal">--</div>
        </div>
      </div>

      <div class="sync-badge hidden" id="syncBadge"></div>

      <button class="btn btn-primary" id="syncBtn" onclick="handleSync()">SYNCHRONISER</button>
      <button class="btn btn-secondary" onclick="alert('Ouvre les reglages Health Connect sur Android')">REGLAGES SANTE</button>
    </div>
  </div>

  <div class="home-bar"></div>
</div>

<div class="nav-dots">
  <div class="dot active" onclick="showScreen(1)"></div>
  <div class="dot" onclick="showScreen(2)"></div>
  <div class="dot" onclick="showScreen(3)"></div>
  <div class="dot" onclick="showScreen(4)"></div>
</div>

<script>
  let currentScreen = 1;

  function showScreen(n) {
    currentScreen = n;
    const dots = document.querySelectorAll('.dot');
    dots.forEach((d, i) => d.classList.toggle('active', i === n - 1));

    const loginScreen = document.getElementById('loginScreen');
    const mainScreen = document.getElementById('mainScreen');
    const syncBadge = document.getElementById('syncBadge');
    const syncBtn = document.getElementById('syncBtn');
    const label = document.getElementById('screenshotLabel');

    switch(n) {
      case 1: // Login
        loginScreen.classList.remove('hidden');
        mainScreen.classList.add('hidden');
        label.textContent = 'Ecran 1/4 : Login';
        break;

      case 2: // Main - datos vacios
        loginScreen.classList.add('hidden');
        mainScreen.classList.remove('hidden');
        document.getElementById('stepsVal').textContent = '--';
        document.getElementById('bpmVal').textContent = '--';
        document.getElementById('sleepVal').textContent = '--';
        document.getElementById('locationText').textContent = '📍 Localisation...';
        syncBadge.classList.add('hidden');
        syncBtn.innerHTML = 'SYNCHRONISER';
        syncBtn.classList.remove('btn-disabled');
        label.textContent = 'Ecran 2/4 : Accueil (avant sync)';
        break;

      case 3: // Syncing
        loginScreen.classList.add('hidden');
        mainScreen.classList.remove('hidden');
        syncBtn.innerHTML = '<span class="spinner"></span> SYNCHRONISATION...';
        syncBtn.classList.add('btn-disabled');
        syncBadge.classList.add('hidden');
        document.getElementById('stepsVal').textContent = '--';
        document.getElementById('bpmVal').textContent = '--';
        document.getElementById('sleepVal').textContent = '--';
        label.textContent = 'Ecran 3/4 : Synchronisation en cours';
        break;

      case 4: // Synced
        loginScreen.classList.add('hidden');
        mainScreen.classList.remove('hidden');
        document.getElementById('stepsVal').textContent = '8 450';
        document.getElementById('bpmVal').textContent = '72';
        document.getElementById('sleepVal').textContent = '7h 18m';
        document.getElementById('locationText').textContent = '📍 48.8566, 2.3522';
        syncBtn.innerHTML = 'SYNCHRONISER';
        syncBtn.classList.remove('btn-disabled');
        syncBadge.textContent = '✅ Synchronise a 19:54';
        syncBadge.className = 'sync-badge sync-success';
        label.textContent = 'Ecran 4/4 : Donnees synchronisees';
        break;
    }
  }

  function handleLogin() {
    const btn = document.getElementById('loginBtn');
    btn.innerHTML = '<span class="spinner"></span> CONNEXION...';
    btn.classList.add('btn-disabled');

    setTimeout(() => {
      btn.innerHTML = 'SE CONNECTER';
      btn.classList.remove('btn-disabled');
      showScreen(2);
    }, 1500);
  }

  function handleSync() {
    showScreen(3);
    setTimeout(() => showScreen(4), 2000);
  }

  function handleLogout() {
    showScreen(1);
  }

  // Keyboard shortcuts for screenshots
  document.addEventListener('keydown', (e) => {
    if (e.key >= '1' && e.key <= '4') {
      showScreen(parseInt(e.key));
    }
    if (e.key === 'ArrowRight' && currentScreen < 4) showScreen(currentScreen + 1);
    if (e.key === 'ArrowLeft' && currentScreen > 1) showScreen(currentScreen - 1);
  });
</script>

</body>
</html>
